<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .box{
        height: 100px;
        width: 100%;
        background-color: green;

        display: flex;
        justify-content: center;
        align-items: center;
        gap: 30px;
    }
    .round{
        height: 60px;
        width: 60px;
        background-color: white;
        border-radius: 50%;
        text-align: center;
        line-height: 60px;
    }
    i{
        /* font-size: 22px; */
    }
    i:hover{
        /* font-size: 30px; */
        transform: scale(2);
        transition: 0.5s;
    }
    .fa-linkedin:hover,.fa-facebook:hover{
        color: blue;
    }
    .fa-instagram:hover{
        color: pink;
    }
    .fa-youtube:hover{
        color: red;
    }
</style>
<body>
    
    <div class="box">
        <div class="round"><i class="fa-brands fa-linkedin"></i></div>
        <div class="round"><i class="fa-brands fa-x-twitter"></i></div>
        <div class="round"><i class="fa-brands fa-instagram"></i></div>
        <div class="round"><i class="fa-brands fa-github"></i></div>
        <div class="round"><i class="fa-brands fa-youtube"></i></div>
        <div class="round"><i class="fa-brands fa-facebook"></i></div>
    </div>


</body>
</html>
