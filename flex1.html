    .container{

    }

        height: 100vh;
        width: 80%;

    }

        color: white;
        text-align: center;
        font-size: 30px;

        text-decoration: none;
        font-size: 22px;
    }
    .black li{
        text-align: center;
        line-height: 70px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.539);
    }

<body>
    

    <div class="container">
        <div class="black">
            <h2>Logo</h2>
            
            <ul>

        </div>

        </div>
