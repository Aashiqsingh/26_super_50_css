<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    *{
        margin: 0;
        padding: 0;
    }
    .navbar{
        height: 100px;
        width: 100%;
        background-color: teal;
    }
    .navbar a{
        color: white;
        padding: 38px;
        line-height: 100px;
        text-decoration: none;
        font-size: 20px;
        font-family: arial;
    }
    .navbar a:hover{
        background-color: orangered;
        color: black;
        font-family: cursive;
        text-shadow: 2px 2px 2px white;
    }
    .box{
        height: 400px;
        width: 100%;
        background-color: red;
        margin-top: 20px;
    }
</style>
<body>

    <div class="navbar">
        <a href="#Home">Home</a>
        <a href="#About">About</a>
        <a href="#Contact">Contact</a>
        <a href="#Service">Services</a>
        <a href="#Products">Products</a>
        <a href="#Blog">Blog</a>
    </div>


    <div class="box" id="Home"><h1>Home</h1></div>
    <div class="box" id="About"><h1>About</h1></div>
    <div class="box" id="Contact"><h1>Contact</h1></div>
    <div class="box" id="Services"><h1>Services</h1></div>
    <div class="box" id="Products"><h1>Products</h1></div>
    <div class="box" id="Blog"><h1>Blog</h1></div>
    
</body>
</html>
